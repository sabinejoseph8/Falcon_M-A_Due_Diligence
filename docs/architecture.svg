<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B1F5C"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="96" fill="#0B1F5C"/>
  <text x="40" y="50" font-size="30" font-weight="700" fill="#FFFFFF">Project Falcon: Multi-Agent M&amp;A Due Diligence in Claude Code</text>
  <text x="40" y="80" font-size="16" fill="#C9D3F0">No application code. Built with subagents, slash commands, a working-memory folder and permission rules.</text>

  <!-- Problem strip -->
  <rect x="40" y="112" width="1320" height="62" rx="6" fill="#EEF0F3"/>
  <text x="60" y="140" font-size="15" font-weight="700" fill="#0B1F5C">THE PROBLEM</text>
  <text x="60" y="162" font-size="14" fill="#2B2F3A">Diligence teams research a target across SEC filings, news, litigation and financial records. Open-ended work that can take 5 to 10 associates several weeks.</text>

  <!-- Agent Core -->
  <rect x="40" y="200" width="420" height="250" rx="8" fill="#0B1F5C"/>
  <text x="250" y="236" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agent Core</text>
  <text x="250" y="258" font-size="14" fill="#C9D3F0" text-anchor="middle">Lead agent, defined in CLAUDE.md</text>
  <circle cx="120" cy="320" r="44" fill="#00B3C8"/>
  <circle cx="250" cy="320" r="44" fill="#00B3C8"/>
  <circle cx="380" cy="320" r="44" fill="#00B3C8"/>
  <text x="120" y="325" font-size="15" font-weight="700" fill="#0B1F5C" text-anchor="middle">PLAN</text>
  <text x="250" y="325" font-size="15" font-weight="700" fill="#0B1F5C" text-anchor="middle">ACT</text>
  <text x="380" y="325" font-size="15" font-weight="700" fill="#0B1F5C" text-anchor="middle">OBSERVE</text>
  <line x1="166" y1="320" x2="202" y2="320" stroke="#FFFFFF" stroke-width="2.5" marker-end="url(#arrw)"/>
  <line x1="296" y1="320" x2="332" y2="320" stroke="#FFFFFF" stroke-width="2.5" marker-end="url(#arrw)"/>
  <path d="M380,366 C380,398 250,398 252,368" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrw)"/>
  <text x="316" y="410" font-size="12.5" fill="#C9D3F0" text-anchor="middle">loop again if needed (max 3 iterations)</text>
  <text x="250" y="436" font-size="13" fill="#FFFFFF" text-anchor="middle">Compares sources, finds conflicts and disclosure gaps</text>

  <!-- Working memory -->
  <rect x="40" y="480" width="420" height="200" rx="8" fill="#00B3C8"/>
  <text x="250" y="514" font-size="22" font-weight="700" fill="#0B1F5C" text-anchor="middle">Working Memory</text>
  <text x="250" y="535" font-size="14" fill="#0B1F5C" text-anchor="middle">memory/ folder (findings, datasets)</text>
  <text x="62" y="568" font-size="13.5" fill="#0B1F5C"><tspan font-weight="700">findings.md</tspan>: register of every finding with ID,</text>
  <text x="62" y="587" font-size="13.5" fill="#0B1F5C">severity, confidence, source and status</text>
  <text x="62" y="612" font-size="13.5" fill="#0B1F5C"><tspan font-weight="700">datasets/</tspan>: key metrics and calculations</text>
  <text x="62" y="637" font-size="13.5" fill="#0B1F5C"><tspan font-weight="700">plan.md, open-questions.md, run-log.md</tspan></text>
  <text x="62" y="660" font-size="12.5" fill="#0B1F5C">(the audit trail of every step and checkpoint)</text>
  <line x1="215" y1="452" x2="215" y2="478" stroke="#0B1F5C" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="226" y="470" font-size="12" fill="#0B1F5C">reads / writes</text>

  <!-- Specialists -->
  <text x="530" y="218" font-size="15" font-weight="700" fill="#0B1F5C">Specialist subagents (run in parallel, read-only)</text>
  <g>
    <rect x="530" y="230" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#0B1F5C" stroke-width="2"/>
    <text x="548" y="262" font-size="18" font-weight="700" fill="#0B1F5C">SEC Filing Search</text>
    <text x="548" y="288" font-size="14" fill="#B5491F" font-family="Menlo, Consolas, monospace">sec-filings-analyst</text>
    <text x="548" y="314" font-size="13" fill="#4A5060">10-K, 10-Q, 8-K, proxy</text>
    <text x="548" y="334" font-size="13" fill="#4A5060">controls, covenants, governance</text>
  </g>
  <g>
    <rect x="800" y="230" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#0B1F5C" stroke-width="2"/>
    <text x="818" y="262" font-size="18" font-weight="700" fill="#0B1F5C">News &amp; Media API</text>
    <text x="818" y="288" font-size="14" fill="#B5491F" font-family="Menlo, Consolas, monospace">news-media-analyst</text>
    <text x="818" y="314" font-size="13" fill="#4A5060">articles, short-seller report</text>
    <text x="818" y="334" font-size="13" fill="#4A5060">fact vs allegation vs rumor</text>
  </g>
  <g>
    <rect x="530" y="370" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#0B1F5C" stroke-width="2"/>
    <text x="548" y="402" font-size="18" font-weight="700" fill="#0B1F5C">Litigation Database</text>
    <text x="548" y="428" font-size="14" fill="#B5491F" font-family="Menlo, Consolas, monospace">litigation-analyst</text>
    <text x="548" y="454" font-size="13" fill="#4A5060">dockets, rulings, exposure</text>
    <text x="548" y="474" font-size="13" fill="#4A5060">injunction and closing risk</text>
  </g>
  <g>
    <rect x="800" y="370" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#0B1F5C" stroke-width="2"/>
    <text x="818" y="402" font-size="18" font-weight="700" fill="#0B1F5C">Financial Analysis</text>
    <text x="818" y="428" font-size="14" fill="#B5491F" font-family="Menlo, Consolas, monospace">financial-analyst</text>
    <text x="818" y="454" font-size="13" fill="#4A5060">statements, add-backs, KPIs</text>
    <text x="818" y="474" font-size="13" fill="#4A5060">leverage and valuation checks</text>
  </g>
  <line x1="460" y1="300" x2="526" y2="300" stroke="#0B1F5C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="493" y="290" font-size="12" font-weight="700" fill="#0B1F5C" text-anchor="middle">ACT</text>
  <line x1="528" y1="440" x2="464" y2="560" stroke="#0B1F5C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="503" y="520" font-size="12" font-weight="700" fill="#0B1F5C" text-anchor="middle" transform="rotate(-62 503 520)">OBSERVE</text>

  <!-- Verifier and report -->
  <rect x="1110" y="230" width="250" height="120" rx="8" fill="#EEF0F3" stroke="#0B1F5C" stroke-width="2"/>
  <text x="1128" y="262" font-size="18" font-weight="700" fill="#0B1F5C">Citation Verifier</text>
  <text x="1128" y="288" font-size="14" fill="#B5491F" font-family="Menlo, Consolas, monospace">citation-verifier</text>
  <text x="1128" y="314" font-size="13" fill="#4A5060">independent quality control:</text>
  <text x="1128" y="334" font-size="13" fill="#4A5060">re-checks every key finding</text>
  <line x1="1050" y1="290" x2="1106" y2="290" stroke="#0B1F5C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1078" y="280" font-size="11" font-weight="700" fill="#0B1F5C" text-anchor="middle">VERIFY</text>

  <rect x="1110" y="380" width="250" height="130" rx="8" fill="#E07B4F"/>
  <text x="1235" y="414" font-size="17.5" font-weight="700" fill="#0B1F5C" text-anchor="middle">Comprehensive Due</text>
  <text x="1235" y="436" font-size="17.5" font-weight="700" fill="#0B1F5C" text-anchor="middle">Diligence Report</text>
  <text x="1235" y="462" font-size="12.5" fill="#0B1F5C" text-anchor="middle">risk matrix, answers to IC questions,</text>
  <text x="1235" y="481" font-size="12.5" fill="#0B1F5C" text-anchor="middle">deal protections (md, html, pdf)</text>
  <line x1="1235" y1="350" x2="1235" y2="376" stroke="#0B1F5C" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Human checkpoints -->
  <rect x="530" y="530" width="830" height="150" rx="8" fill="#FFF8E6" stroke="#E5B53C" stroke-width="2"/>
  <text x="552" y="562" font-size="16" font-weight="700" fill="#0B1F5C">Human-in-the-loop checkpoints (the system stops and waits for a person)</text>
  <rect x="552" y="580" width="250" height="78" rx="39" fill="#F6C344"/>
  <text x="677" y="612" font-size="16" font-weight="700" fill="#0B1F5C" text-anchor="middle">1. Approve the plan</text>
  <text x="677" y="636" font-size="12.5" fill="#0B1F5C" text-anchor="middle">after PLAN, before any analysis</text>
  <rect x="822" y="580" width="250" height="78" rx="39" fill="#F6C344"/>
  <text x="947" y="612" font-size="16" font-weight="700" fill="#0B1F5C" text-anchor="middle">2. Review red flags</text>
  <text x="947" y="636" font-size="12.5" fill="#0B1F5C" text-anchor="middle">dig deeper, or proceed to verify</text>
  <rect x="1092" y="580" width="250" height="78" rx="39" fill="#F6C344"/>
  <text x="1217" y="612" font-size="16" font-weight="700" fill="#0B1F5C" text-anchor="middle">3. Sign off</text>
  <text x="1217" y="636" font-size="12.5" fill="#0B1F5C" text-anchor="middle">after verification, before report</text>

  <!-- Controls -->
  <rect x="40" y="710" width="1320" height="118" rx="8" fill="#0B1F5C"/>
  <text x="62" y="742" font-size="16" font-weight="700" fill="#FFFFFF">CONTROLS: autonomous agents are powerful but hard to control, so every step is bounded</text>
  <g font-size="14" fill="#FFFFFF">
    <text x="62" y="772">&#8226; Mandatory human checkpoints</text>
    <text x="62" y="800">&#8226; Max 3 Plan, Act, Observe loops</text>
    <text x="392" y="772">&#8226; Specialists are read-only</text>
    <text x="392" y="800">&#8226; Source data cannot be edited</text>
    <text x="722" y="772">&#8226; Web access blocked (settings.json)</text>
    <text x="722" y="800">&#8226; Every finding cites file and section</text>
    <text x="1052" y="772">&#8226; Rumors and allegations labeled</text>
    <text x="1052" y="800">&#8226; Graded against an answer key</text>
  </g>
  <text x="40" y="868" font-size="13" fill="#6B7280">All companies, people and data are fictional. Portfolio case study built with Claude Code.</text>
</svg>
